name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Core tests
        run: ./gradlew :core:budget:test :core:design:testDebugUnitTest

      # Runs every app unit test and compares each screenshot with its baseline in app/src/test/snapshots.
      - name: App tests and screenshots
        run: ./gradlew :app:verifyRoborazziDebug

      - name: Debug APK
        run: ./gradlew :app:assembleDebug

      # Release builds have their own source set (no sample budgets), so compile it too.
      - name: Release compile
        run: ./gradlew :app:compileReleaseKotlin

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            core/*/build/reports/tests
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: due-north-budget-debug
          path: app/build/outputs/apk/debug/*.apk
