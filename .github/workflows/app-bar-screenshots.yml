name: Record app bar screenshots

on:
  push:
    branches: [claude/project-thread-vjrjxj]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --no-daemon :core:design:testDebugUnitTest :app:testDebugUnitTest || echo "TESTS_FAILED=1" >> $GITHUB_ENV
      - name: Record screenshots
        run: ./gradlew --no-daemon :app:recordRoborazziDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/reports/tests
            core/design/build/reports/tests
      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/test/snapshots
          git commit -m "Record screenshots from run ${{ github.run_id }} [skip ci]" || true
          git push origin HEAD:${{ github.ref_name }}
      - name: Fail on test failures
        if: env.TESTS_FAILED == '1'
        run: exit 1
