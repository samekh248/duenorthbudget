name: Build APKs and screenshots

on:
  push:
    branches: [claude/project-thread-1rtdcx]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      - name: Record screenshots
        run: ./gradlew --no-daemon :app:recordRoborazziDebug
      - name: Sign release APK with a debug key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p out/screenshots
          KS=out/sign.keystore
          keytool -genkeypair -keystore $KS -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk out/aligned.apk
          "$BT/apksigner" sign --ks $KS --ks-pass pass:android \
            --ks-key-alias androiddebugkey --key-pass pass:android \
            --out out/due-north-budget-release.apk out/aligned.apk
          "$BT/apksigner" verify out/due-north-budget-release.apk
          rm out/aligned.apk $KS
          cp app/build/outputs/apk/debug/app-debug.apk out/due-north-budget-debug.apk
          cp app/src/test/snapshots/*.png out/screenshots/
          ls -lR out
      - uses: actions/upload-artifact@v4
        with:
          name: due-north-build
          path: out/
      - name: Commit outputs to the branch
        run: |
          rm -rf build-outputs && mv out build-outputs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build-outputs
          git commit -m "Add build outputs from run ${{ github.run_id }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
